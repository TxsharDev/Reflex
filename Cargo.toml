[package]
name = "reflex"
version = "2.2.0"
edition = "2024"
authors = ["Tushar Sharma <Txshar@proton.me>"]
description = "Command palette for Windows: apps, files, clipboard history, calculator, system actions."
repository = "https://github.com/TxsharDev/Reflex"
license = "MIT"
readme = "README.md"
keywords = ["launcher", "command-palette", "productivity", "windows", "search"]
categories = ["gui"]

[dependencies]
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow"] }
nucleo-matcher = "0.3"
arboard = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
raw-window-handle = "0.6"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Power",
    "Win32_System_Shutdown",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
strip = true
lto = true
opt-level = 2
codegen-units = 1
