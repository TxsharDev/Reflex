[package]
name = "reflex"
version = "2.0.0"
edition = "2024"
authors = ["Tushar Sharma <Txshar@proton.me>"]
description = "Instant PC runtime for Windows. Command palette, file search, clipboard history, GPU-rendered."
repository = "https://github.com/TxsharDev/Reflex"
license = "MIT"
readme = "README.md"
keywords = ["launcher", "command-palette", "productivity", "windows", "search"]
categories = ["command-line-utilities"]

[dependencies]
# UI - egui with wgpu backend for GPU rendering
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow", "persistence"] }

# Fuzzy matching - same engine as helix editor
nucleo-matcher = "0.3"

# File system
walkdir = "2"
notify = { version = "7", features = ["macos_fsevent"] }

# System
arboard = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
open = "5"
image = { version = "0.25", default-features = false, features = ["png"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_DataExchange",
    "Win32_Foundation",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_Graphics_Dwm",
] }

[target.'cfg(target_os = "linux")'.dependencies]
eframe = { version = "0.31", default-features = false, features = ["x11", "wayland"] }

[profile.release]
strip = true
lto = true
opt-level = 2
codegen-units = 1
